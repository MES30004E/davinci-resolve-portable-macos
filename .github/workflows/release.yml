name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test on Apple Silicon macOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner information
        run: |
          sw_vers
          uname -m

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Expected an arm64 macOS runner."
            exit 1
          fi

      - name: Validate tag
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected something like v0.2.0 or v0.3.0-beta.1"
            exit 1
          fi

      - name: Make scripts executable
        run: |
          chmod +x \
            "Build Portable Resolve.command" \
            "Update Portable Resolve.command" \
            "Uninstall.command" \
            scripts/*.sh \
            scripts/*.command \
            tests/run.sh

      - name: Run safe test suite
        env:
          DAVINCI_PORTABLE_NO_ANIMATION: "1"
        run: ./tests/run.sh

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create GitHub prerelease
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease

      - name: Create GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
