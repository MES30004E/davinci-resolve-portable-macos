name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test on Apple Silicon macOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Apple Silicon runner
        run: |
          sw_vers
          uname -m

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Expected an arm64 macOS runner."
            exit 1
          fi

      - name: Validate release tag
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

      - name: Make scripts executable
        run: |
          chmod +x \
            "Build Portable Resolve.command" \
            "Update Portable Resolve.command" \
            "Uninstall.command" \
            scripts/*.sh \
            scripts/*.command \
            tests/run.sh

      - name: Run safe test suite
        env:
          DAVINCI_PORTABLE_NO_ANIMATION: "1"
        run: ./tests/run.sh

  release:
    name: Build friendly release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          PACKAGE="davinci-resolve-portable-macos-${TAG}"

          mkdir -p "dist/$PACKAGE"

          cp \
            "Build Portable Resolve.command" \
            "Update Portable Resolve.command" \
            "Uninstall.command" \
            README.md \
            LICENSE \
            CHANGELOG.md \
            SECURITY.md \
            CONTRIBUTING.md \
            "dist/$PACKAGE/"

          cp -R \
            docs \
            scripts \
            src \
            tests \
            "dist/$PACKAGE/"

          chmod +x \
            "dist/$PACKAGE/Build Portable Resolve.command" \
            "dist/$PACKAGE/Update Portable Resolve.command" \
            "dist/$PACKAGE/Uninstall.command" \
            dist/"$PACKAGE"/scripts/*.sh \
            dist/"$PACKAGE"/scripts/*.command \
            dist/"$PACKAGE"/tests/run.sh

          (
            cd dist
            zip -r "${PACKAGE}.zip" "$PACKAGE"
            sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"
          )

      - name: Create friendly release introduction
        shell: bash
        run: |
          cat > release-intro.md <<EOF
          # DaVinci Resolve Portable for macOS ${GITHUB_REF_NAME}

          Build a portable macOS installation from your own official DaVinci Resolve installer.

          > Experimental / vibecoded project. Use at your own risk.

          ## Install

          1. Download \`davinci-resolve-portable-macos-${GITHUB_REF_NAME}.zip\` from Assets below.
          2. Extract the ZIP.
          3. Double-click \`Build Portable Resolve.command\`.
          4. Select your official DaVinci Resolve macOS \`.pkg\`.
          5. Select your external drive or destination folder.
          6. Wait for the builder to finish.
          7. Launch the generated \`DaVinci Resolve.app\`.

          ## Updating

          Existing portable installations can be updated by double-clicking
          \`Update Portable Resolve.command\` and selecting the newer official Resolve \`.pkg\`.

          ## More information

          See the README and `docs/` for requirements, backup and safety information,
          updating, uninstalling, troubleshooting, and technical details.

          ## Changes
          EOF

      - name: Create prerelease
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/davinci-resolve-portable-macos-${GITHUB_REF_NAME}.zip#Portable Resolve Builder" \
            "dist/davinci-resolve-portable-macos-${GITHUB_REF_NAME}.zip.sha256#SHA-256 checksum" \
            --verify-tag \
            --title "DaVinci Resolve Portable ${GITHUB_REF_NAME}" \
            --notes "$(cat release-intro.md)" \
            --generate-notes \
            --prerelease

      - name: Create stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/davinci-resolve-portable-macos-${GITHUB_REF_NAME}.zip#Portable Resolve Builder" \
            "dist/davinci-resolve-portable-macos-${GITHUB_REF_NAME}.zip.sha256#SHA-256 checksum" \
            --verify-tag \
            --title "DaVinci Resolve Portable ${GITHUB_REF_NAME}" \
            --notes "$(cat release-intro.md)" \
            --generate-notes
